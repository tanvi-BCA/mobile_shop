<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Address - Mobile Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d32f2f;
            margin-bottom: 20px;
            text-align: center;
        }
        form div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type=text], input[type=email], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; }
        input[type=checkbox] {
            transform: scale(1.2);
            margin-right: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 3px;
        }
        button {
            background: #d32f2f;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
        }
        button:hover { background: #b71c1c; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #d32f2f;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Add New Address</h1>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
        <div>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <div class="error">{{ field.errors|striptags }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit">Save Address</button>
    </form>

    <a href="{% url 'my_address' %}" class="back-link">&larr; Back to My Addresses</a>
</div>

</body>
</html>
