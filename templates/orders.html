<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>
</head>
<body>
    <h2>My Orders</h2>
    {% if orders %}
        <ul>
        {% for order in orders %}
            <li>Order #{{ order.id }} - {{ order.status }} - ₹{{ order.total_amount }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No orders yet.</p>
    {% endif %}
</body>
</html>
